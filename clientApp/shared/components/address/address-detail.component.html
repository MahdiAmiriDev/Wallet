<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">

        <dxi-item [label]="{text: 'آدرس'}" dataField="address">
        </dxi-item>
        <dxi-item [label]="{text: 'شهر'}" dataField="cityId" editorType='dxNumberBox'>
            <dxi-validation-rule type="required" message="شهر اجباری می باشد"></dxi-validation-rule>
        </dxi-item>
        <dxi-item [label]="{text: 'رایانامه (Email)'}" dataField="email">


        </dxi-item>
        <dxi-item [label]="{text: 'شماره تلفن'}" dataField="telephone">


        </dxi-item>
        <dxi-item [label]="{text: 'شماره موبایل'}" dataField="mobileNumber">


        </dxi-item>
        <dxi-item [label]="{text: 'دور نگار'}" dataField="faxNumber">


        </dxi-item>
        <dxi-item [label]="{text: 'کد پستی'}" dataField="postalCode">


        </dxi-item>

        <dxi-item dataField="accessLevelId" editorType="dxSelectBox" [label]="{text: 'سطح دسترسی'}"
                  [editorOptions]="{ items: accessLevels,displayExpr:'title',valueExpr:'id' }">
            <dxi-validation-rule type="required" message="سطح دسترسی اجباری می باشد"></dxi-validation-rule>

        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
