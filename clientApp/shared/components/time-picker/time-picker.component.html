<div class="row col-12">

  <div class="col-6">
    <dx-select-box
      [text]="'دقیقه'"
      [label]="'دقیقه'"
      [hint]="'دقیقه'"
      [placeholder]="'دقیقه'"
      [items]="minutes"
      [(value)]="selectedMinutes"
      [showClearButton]="false"
      (onSelectionChanged)="selectedMinutesChanged($event)">
      <dx-validator *ngIf="required">
        <dxi-validation-rule type="required" message="دقیقه اجباری میباشد"></dxi-validation-rule>
      </dx-validator>
    </dx-select-box>
  </div>

  <div class="col-6">
    <dx-select-box
      [text]="'ساعت'"
      [label]="'ساعت'"
      [hint]="'ساعت'"
      [placeholder]="'ساعت'"
      [items]="hours"
      [(value)]="selectedHour"
      [showClearButton]="false"
      (onSelectionChanged)="selectedHoursChanged($event)">
      <dx-validator *ngIf="required">
        <dxi-validation-rule type="required" message="ساعت اجباری میباشد"></dxi-validation-rule>
      </dx-validator>
    </dx-select-box>
  </div>
</div>
