<form *ngIf="loadForm" autocomplete="off"
      (ngSubmit)="onFormSubmit($event)" #detailFormww="ngForm" class="p-1"
      style="padding: 0 !important; margin: 0px !important;"
      enctype="multipart/form-data">
  <div style="border: 1px solid #ddd;text-align: right;background: #ddd;margin-bottom: 2px" class="p-1">
    <dx-button
      id="btnSave"
      [text]="saveButtonText"
      icon="save"
      type="default"
      style="font-size: 11px"
      [disabled]="!allowSave "
      *ngIf="showSaveButton"
      [useSubmitBehavior]="true">
    </dx-button>
    <dx-button
      class="ml-2 mediumIcon"
      id="btnClose"
      text="بستن"
      style="margin-right: 5px;"
      type="default"
      *ngIf="showCloseButton"
      icon="close"
      (onClick)="onCancelClicked()">
    </dx-button>
    <dx-button *ngFor='let button of customButtons'
               class="mediumIcon" [icon]="button.icon"
               [text]="button.text"
               [type]="button.type"
               style="margin-right: 5px;font-size: 12px !important;"
               (onClick)="selectedCustomButtonChanged(button.key)">
    </dx-button>
  </div>
  <div id="form-container"
       style="text-align: right;border: 1px solid #ddd; padding-top: 15px;padding-left: 5px;padding-right: 5px"
       [ngClass]="{'dx-rtl': true}">
    <dx-scroll-view [height]="formHeight" rtlEnabled="true" *ngIf="fixHeight else scrollLess">
      <div style="padding: 25px">
        <ng-container *ngTemplateOutlet="formItem"></ng-container>
      </div>
    </dx-scroll-view>
    <ng-template #scrollLess>
      <ng-container *ngTemplateOutlet="formItem"></ng-container>
    </ng-template>
  </div>
</form>
<ng-template #formItem>
  <ng-content></ng-content>
</ng-template>
