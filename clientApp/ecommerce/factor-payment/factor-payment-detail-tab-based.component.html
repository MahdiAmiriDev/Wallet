<dx-tab-panel #tabPanel
              rtlEnabled="true"
              [dataSource]="tabs"
              selectedIndex="0"
              [loop]="false"
              (onSelectionChanged)="reloadDataForSelectedTab($event)"
              [animationEnabled]="false"
              [swipeEnabled]="false">
  <div *dxTemplate="let company of 'factorPayment'" class="tab-content-edit-form">
    <app-factor-payment-detail #factorPaymentDetail [factorId]="factorId"
                               (afterInsertRow)="rowInserted($event)"
                               [selectedEntityId]="selectedEntityId"
                               [closeAfterSave]="false"
                               #mainBaseEdit
                               (closeFormClick)="closeFormClick.emit($event)">
    </app-factor-payment-detail>
  </div>
  <div *dxTemplate="let company of 'factorDeduction'" class="tab-content-edit-form">
    <app-factor-deduction-list
      [factorId]="factorId"
      [showAddButton]="true"
      [allowEditInForm]="true"
      [allowDeleteInForm]="false">
    </app-factor-deduction-list>
  </div>
  <div *dxTemplate="let company of 'factorPaymentDocs'" class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="44"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>
</dx-tab-panel>
