<app-base-list-form #listForm
                    (afterInitialDetailComponent)="afterInitialDetailComponent($event)"
                    [loadAfterSetFilter]="loadAfterSetFilter"
                    (selectedRowChanged)="selectedRowChanged.emit($event)"
                    [columns]="columns"
                    [entityName]="entityName"
                    [customRowButtons]="customRowButtons"
                    [detailComponent]="detailComponent">
</app-base-list-form>

<dx-popup
        [title]="popUpTitle"
        *ngIf="showPopUp"
        [(visible)]="showPopUp"
        [closeOnOutsideClick]="true"
        [deferRendering]="false"
        [dragEnabled]="false"
        [fullScreen]="true"
        rtlEnabled="true"
        class="popup">

    <app-sale-configuration-attribute-list *ngIf="showSaleConfigurationPopup" [saleConfigurationId]="saleConfigurationId">
    </app-sale-configuration-attribute-list>

 <app-tax-category-sale-configuration-list *ngIf="showTaxConfigurationPopup" [saleConfigurationId]="saleConfigurationId" >

 </app-tax-category-sale-configuration-list>

</dx-popup>
