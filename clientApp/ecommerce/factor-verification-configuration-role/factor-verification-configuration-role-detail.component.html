<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
  <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">
    <dxi-item dataField="factorVerificationConfigurationId" editorType="dxLookup"
              [label]="{text: 'تنظیم نقش بررسی فاکتور'}"
              [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: factorVerificationConfigurationDataSource,displayExpr:'title',valueExpr:'id' }">
      <dxi-validation-rule type="required" message="تنظیم نقش بررسی فاکتور اجباری می باشد"></dxi-validation-rule>
    </dxi-item>

    <dxi-item dataField="roleId" editorType="dxLookup" [label]="{text: 'نقش'}"
              [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: roleDataSource,displayExpr:'title',valueExpr:'id' }">
      <dxi-validation-rule type="required" message="نقش اجباری می باشد"></dxi-validation-rule>
    </dxi-item>
    <dxi-item [label]="{text: 'ترتیب بررسی'}" dataField="verificationOrder" editorType='dxNumberBox'>
      <dxi-validation-rule type="required" message="ترتیب بررسی اجباری می باشد"></dxi-validation-rule>
    </dxi-item>
    <dxi-item [label]="{text: 'توضیحات'}" dataField="description" editorType='dxTextArea'>
    </dxi-item>
  </dx-form>
</app-base-edit-form></app-busy-indicator>
