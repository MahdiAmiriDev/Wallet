<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let item of 'taxCategorySaleConfiguration'" class="tab-content-edit-form">
			<app-tax-category-sale-configuration-detail 
                [selectedEntityId]="selectedEntityId" 
                (afterInsertRow)="rowInserted($event)"  
                entityName="taxCategorySaleConfiguration" 
                
                    [parentId]="parentId"
                
                    [taxCategoryId]="taxCategoryId"
                
                    [saleConfigurationId]="saleConfigurationId"
                
                    [factorReportType]="factorReportType"
                >
            </app-tax-category-sale-configuration-detail>
	</div>
    
		<div *dxTemplate="let item of 'taxCategorySaleConfiguration'" class="tab-content-edit-form">
			<app-content-editor [selectedEntityId]="selectedEntityId" entityName="taxCategorySaleConfiguration" 
                                propertyName="Description"
								propertyLabel="توضیحات"></app-content-editor>
		</div>
</dx-tab-panel>
