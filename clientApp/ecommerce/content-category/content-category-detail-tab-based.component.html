<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'contentCategory'" class="tab-content-edit-form">
    <app-content-category-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="contentCategory"
      [parentId]="parentId"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)">
    </app-content-category-detail>
  </div>
  <!--    <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">-->
  <!--        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="contentCategory"-->
  <!--                            propertyName="Description"-->
  <!--                            propertyLabel="توضیحات"></app-content-editor>-->
  <!--    </div>-->
  <div *dxTemplate="let pic of 'categoryFile'" class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="43"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>
</dx-tab-panel>
