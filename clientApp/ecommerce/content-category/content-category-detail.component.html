<app-busy-indicator><app-base-edit-form [showCloseButton]='false' (submitEvent)="formSubmit($event)"
                    (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">
        <dxi-item [label]="{text: 'عنوان'}" dataField="title">
            <dxi-validation-rule type="required" message="عنوان اجباری می باشد"></dxi-validation-rule>
        </dxi-item>
        <dxi-item [label]="{text: 'توضیحات'}" dataField="description" editorType='dxTextArea'>
         </dxi-item>
        <dxi-item dataField="parentId" editorType="dxLookup" [label]="{text: 'پدر'}"
                  [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: parentDataSource,displayExpr:'title',valueExpr:'id' }">
        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
