
				<app-base-edit-form   (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
	<dx-form id="form"  [colCount]="2" #detailForm [formData]="entity">

									<dxi-item [label]="{text: 'کد'}"  dataField="code"     >


				</dxi-item>
									<dxi-item [label]="{text: 'عنوان'}"  dataField="title"     >

																<dxi-validation-rule  type="required" message="عنوان اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
									<dxi-item [label]="{text: 'توضیحات'}"  dataField="description" editorType='dxTextArea'    >


				</dxi-item>
									<dxi-item [label]="{text: 'کد رهگیری پذیرنده-ردیف گردش ترمینال-hekmatId-کد سمت حکمت'}"  dataField="installmentTrackingCode"     >


				</dxi-item>
									<dxi-item [label]="{text: 'شماره کارت - CardHashPan'}"  dataField="cardNumber"     >


				</dxi-item>
									<dxi-item [label]="{text: 'کد ملی'}"  dataField="nationalCode"     >


				</dxi-item>
									<dxi-item [label]="{text: 'تعداد اقساط'}"  dataField="installmentCount" editorType='dxNumberBox'    >


				</dxi-item>
									<dxi-item [label]="{text: 'مبلغ تراکنش'}"  dataField="price" editorType='dxNumberBox'   [editorOptions]="{format: '#,##0', min: 0}" >


				</dxi-item>

									<dxi-item dataField="hekmatTransactionStatusType" editorType="dxSelectBox" [label]="{text: 'وضعیت تراکنش'}"
					[editorOptions]="{ items: hekmatTransactionStatusTypes,displayExpr:'title',valueExpr:'id' }">

				</dxi-item>
									<dxi-item [label]="{text: 'توکن حکمت - از سمت حکمت ارسال می شود'}"  dataField="hekmatToken"     >

																<dxi-validation-rule  type="required" message="توکن حکمت - از سمت حکمت ارسال می شود اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
									<dxi-item [label]="{text: 'نتیجه تراکنش حکمت'}"  dataField="transactionResult" editorType='dxTextArea'    >

																<dxi-validation-rule  type="required" message="نتیجه تراکنش حکمت اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
									<dxi-item [label]="{text: 'آیا تراکنش مربوط به خرید آموزشی می باشد'}"  dataField="isLearn" editorType='dxCheckBox'    >


				</dxi-item>

									<dxi-item dataField="accessLevelId" editorType="dxSelectBox" [label]="{text: 'سطح دسترسی'}"
					[editorOptions]="{ items: accessLevels,displayExpr:'title',valueExpr:'id' }">
																					<dxi-validation-rule  type="required" message="سطح دسترسی اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
</dx-form>
</app-base-edit-form>
