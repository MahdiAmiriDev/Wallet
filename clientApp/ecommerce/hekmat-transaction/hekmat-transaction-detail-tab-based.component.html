<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'hekmatTransaction'" class="tab-content-edit-form">
    <app-hekmat-transaction-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="hekmatTransaction"
      [hekmatTransactionStatusType]="hekmatTransactionStatusType"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-hekmat-transaction-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="hekmatTransaction" propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'transactionResult'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="hekmatTransaction"
                        propertyName="TransactionResult"
                        propertyLabel="نتیجه تراکنش حکمت"></app-content-editor>
  </div>
</dx-tab-panel>
