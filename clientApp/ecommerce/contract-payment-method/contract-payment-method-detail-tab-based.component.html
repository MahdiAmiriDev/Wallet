<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'contractPaymentMethod'" class="tab-content-edit-form">
    <app-contract-payment-method-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="contractPaymentMethod"
      [contractId]="contractId"
      [paymentMethodType]="paymentMethodType"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-contract-payment-method-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="contractPaymentMethod"
                        propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
</dx-tab-panel>
