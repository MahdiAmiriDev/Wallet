<app-base-list-form
  #listForm
  [allowGrouping]="false"
  [showAddButton]="showAddButton"
  [allowEditInForm]="allowEditInForm"
  [allowDeleteInForm]="allowDeleteInForm"
  [showResourceAppActionPopUp]="false"
	(afterInitialDetailComponent)="afterInitialDetailComponent($event)"
	[loadAfterSetFilter]="loadAfterSetFilter"
	(selectedRowChanged)="selectedRowChanged.emit($event)"
	[columns]="columns"
	[entityName]="'additionalUserPropGroup'"
  [title]="'تخصیص گروه مرکز به کاربر'"
	[detailComponent]="detailComponent">
</app-base-list-form>
