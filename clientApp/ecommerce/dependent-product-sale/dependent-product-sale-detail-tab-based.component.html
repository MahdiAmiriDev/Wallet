<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'dependentProductSale'" class="tab-content-edit-form">
    <app-dependent-product-sale-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="dependentProductSale"
      [mainProductId]="mainProductId"
      [relatedProductId]="relatedProductId"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-dependent-product-sale-detail>
  </div>
</dx-tab-panel>
