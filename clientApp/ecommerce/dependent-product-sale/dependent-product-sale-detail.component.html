<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">


        <dxi-item dataField="mainProductId" editorType="dxLookup" [label]="{text: 'محصول اصلی'}"
                  [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: mainProductDataSource,displayExpr:'title',valueExpr:'id' }">
            <dxi-validation-rule type="required" message="محصول اصلی اجباری می باشد"></dxi-validation-rule>
        </dxi-item>

        <dxi-item dataField="relatedProductId" editorType="dxLookup" [label]="{text: 'محصول وابسته'}"
                  [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: relatedProductDataSource,displayExpr:'title',valueExpr:'id' }">
            <dxi-validation-rule type="required" message="محصول وابسته اجباری می باشد"></dxi-validation-rule>
        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
