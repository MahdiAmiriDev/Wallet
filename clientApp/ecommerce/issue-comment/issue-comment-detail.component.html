<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
  <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">


    <dxi-item dataField="issueId" editorType="dxLookup" [label]="{text: 'شناسه محصول'}"
              [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: issueDataSource,displayExpr:'title',valueExpr:'id' }">

      <dxi-validation-rule type="required" message="شناسه محصول اجباری می باشد"></dxi-validation-rule>

    </dxi-item>
    <dxi-item [label]="{text: 'توضیحات'}" dataField="comment" editorType='dxTextArea'>
      <dxi-validation-rule type="required" message="توضیحات اجباری می باشد"></dxi-validation-rule>
    </dxi-item>
  </dx-form>
</app-base-edit-form></app-busy-indicator>
