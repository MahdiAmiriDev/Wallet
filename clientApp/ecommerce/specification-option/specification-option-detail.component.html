<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">

        <dxi-item dataField="specificationId" editorType="dxLookup" [label]="{text: 'مشخصات'}"
                  [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: specificationDataSource,displayExpr:'title',valueExpr:'id' }">
            <dxi-validation-rule type="required" message="مشخصات اجباری می باشد"></dxi-validation-rule>
        </dxi-item>
        <dxi-item [label]="{text: 'عنوان'}" dataField="title">
            <dxi-validation-rule type="required" message="عنوان اجباری می باشد"></dxi-validation-rule>
        </dxi-item>
        <dxi-item [label]="{text: 'ترتیب نمایش'}" dataField="displayOrder" editorType='dxNumberBox'>
            <dxi-validation-rule type="required" message="ترتیب نمایش اجباری می باشد"></dxi-validation-rule>
        </dxi-item>

        <dxi-item [label]="{text: 'رنگ'}" dataField="colorSquaresRgb" editorType="dxColorBox">
        </dxi-item>

        <dxi-item [label]="{text: 'ویژگی پیش فرض'}" dataField="isDefault" editorType='dxCheckBox'>
        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
