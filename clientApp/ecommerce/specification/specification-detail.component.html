<app-busy-indicator><app-base-edit-form [fixHeight]="false" (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">
        <dxi-item [label]="{text: 'عنوان'}" dataField="title">
            <dxi-validation-rule type="required" message="عنوان اجباری می باشد"></dxi-validation-rule>
        </dxi-item>

        <dxi-item [label]="{text: 'توضیحات'}" dataField="description" editorType='dxTextArea' colSpan="2">
        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
<app-specification-option-list *ngIf="selectedEntityId"
                               [specificationId]="selectedEntityId"></app-specification-option-list>
