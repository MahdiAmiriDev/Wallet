<div *ngIf="_invalidItem" class="alert alert-info">
  <span style="color: #ff0000"> کاربر گرامی فایل اکسل بارگذاری شده دارای خطا های زیر می باشد، لطفا بعد از رفع آنها مجددا فایل را بارگذاری نمایید </span>
</div>

<div *ngIf="!_invalidItem" class="alert alert-info">
  <span style="color: green"> کاربر گرامی فایل اکسل شما بدون خطا بارگذاری شد، برای به روز رسانی در سایت دکمه ثبت نهایی را کلیک کنید </span>
</div>
<app-busy-indicator>
  <app-base-list-form #listForm
                      [showAddButton]="false"
                      [allowEditInForm]="false"
                      [allowDeleteInForm]="false"
                      [gridHeight]="gridHeight"
                      [fixHeight]="fixHeight"
                      [loadAfterSetFilter]="loadAfterSetFilter"
                      [wordWrapEnabled]="true"
                      [columns]="columns"
                      [entityName]="entityName"
                      (customButtonClicked)="customButtonClicked($event)"
                      [customButtons]="customButtons">
  </app-base-list-form>
</app-busy-indicator>

<dx-popup
  class="popup"
  [fullScreen]="true"
  [showTitle]="true"
  rtlEnabled="true"
  title="محصولات فروش رفته"
  [dragEnabled]="false"
  [(visible)]="showRenamedProductDialog"
  [deferRendering]="false"
  >
<app-renamed-products-list *ngIf="showRenamedProductDialog"
                           [companyId]="_companyId"
                           (afterContinueFinalRegistration)="afterContinueFinalRegistration()"
                           (afterCancelFinalRegistration)="afterCancelFinalRegistration()">

</app-renamed-products-list>
</dx-popup>
