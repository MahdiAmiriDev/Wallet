<div *ngIf="invalidItem" class="alert alert-danger">
  <span style="color: #7f0200" [textContent]="message"></span>
</div>

<div *ngIf="!invalidItem" class="alert alert-info">
  <span style="color: green"> کاربر گرامی فایل اکسل شما بدون خطا بارگذاری شد، برای به روز رسانی در سایت دکمه ثبت نهایی را کلیک کنید </span>
</div>
<app-busy-indicator>
  <dx-button *ngIf="!invalidItem" text="ثبت نهایی" type="success" icon="file" (onClick)="finalRegistrationButtonClicked()"></dx-button>
</app-busy-indicator>
