
	

<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let company of 'preRegistration'" class="tab-content-edit-form">
						<app-pre-registration-detail 
                            [selectedEntityId]="selectedEntityId" 
                            (afterInsertRow)="rowInserted($event)"  
                            entityName="preRegistration" 
                                                        [userId]="userId"
                            >
                        </app-pre-registration-detail>
					</div>
					<div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
						<app-content-editor [selectedEntityId]="selectedEntityId" entityName="preRegistration" propertyName="Description"
											propertyLabel="توضیحات"></app-content-editor>
					</div>
				</dx-tab-panel>
