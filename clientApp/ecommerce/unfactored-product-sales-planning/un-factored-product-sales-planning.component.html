<div style="width: 100%;" [style.height.px]="contentHeight">
    <app-representation-filter (selectedCompanyChanged)="setSelectedCompany($event)"
                               (selectedRepresentationChanged)="onSelectedRepresentationChanged($event)">

    </app-representation-filter>
    <div class="row">
        <div class="col-12">
            <div style="width: 100%;" [style.height.px]="contentHeight">
                <div class="customButtonContainer"
                     style="background-color: #8588c6;text-align: right;padding-top: 5px;padding-right: 5px;">
                    <dx-button
                            style="width:88px; margin-bottom: 6px"
                            class="dx-button-success"
                            text="تایید"
                            hint="تایید"
                            (onClick)="checkIsItemSelected()">
                    </dx-button>
                </div>
                <dx-data-grid id="gridContainer"
                              width="100%"
                              height="94%"
                              [dataSource]="productSalesPlanningDataSource"
                              [showBorders]="true"
                              [rtlEnabled]="true"
                              [height]="gridHeight"
                              [rowAlternationEnabled]="true"
                              [columns]="columns"
                              [wordWrapEnabled]="true"
                              [remoteOperations]="lazyLoading"
                              (onSelectionChanged)="selectedUserChanged($event);">
                    <dxo-filter-row visible="true"></dxo-filter-row>
                    <dxo-header-filter visible="true"></dxo-header-filter>
                    <dxo-selection [mode]="mode" [allowSelectAll]="false"></dxo-selection>
                    <div *dxTemplate="let data of 'selectCellTemplate'">
                        <dx-radio-group [items]="[{id:data.data.id}]" valueExpr="id">
                        </dx-radio-group>
                    </div>
                    <div *dxTemplate="let data of 'intDate'">
                        {{data.displayValue | intToStringDate}}
                    </div>
                    <div *dxTemplate="let data of 'number'" style="direction: ltr !important;">
                        {{data.displayValue | number}}
                    </div>
                </dx-data-grid>
            </div>
        </div>
    </div>
</div>
