<dx-tab-panel
  #tabPanel
  rtlEnabled="true"
  [dataSource]="tabs"
  [selectedIndex]="0"
  [loop]="false"
  [animationEnabled]="false"
  [swipeEnabled]="false">
  <div *dxTemplate="let company of 'vocherType'" class="tab-content-edit-form">
    <app-vocher-type-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="vocherType"
      [companyId]="companyId"
    >
    </app-vocher-type-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="vocherType" propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
</dx-tab-panel>
