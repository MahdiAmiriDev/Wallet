<dx-tab-panel #tabPanel
              rtlEnabled="true"
              [dataSource]="tabs"
              [selectedIndex]="0"
              [loop]="false"
              [animationEnabled]="false"
              [swipeEnabled]="false">
  <div *dxTemplate="let company of 'factor'" class="tab-content-edit-form">
    <app-factor-detail [selectedEntityId]="selectedEntityId"
                       (afterInsertRow)="rowInserted($event)"
                       entityName="factor"
                       [taxCategoryId]="taxCategoryId"
                       [companyId]="companyId"
                       [representationId]="representationId"
                       [factorReviewStatusType]="factorReviewStatusType"
                       [closeAfterSave]="false"
                       #mainBaseEdit
                       (closeFormClick)="closeFormClick.emit($event)">
    </app-factor-detail>
  </div>
  <div *dxTemplate="let company of 'factorItems'" class="tab-content-edit-form">
    <app-factor-item-list [factorId]="selectedEntityId"></app-factor-item-list>
  </div>
  <div *dxTemplate="let company of 'factorDocs'" class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="42"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>
  <div *dxTemplate="let company of 'factorVerifications'" class="tab-content-edit-form">
    <app-factor-verifier-description-list [factorId]="selectedEntityId"></app-factor-verifier-description-list>
  </div>
</dx-tab-panel>
