<div class="row">
  <div class="row">
    <app-refund-detail-assigned-users>
    </app-refund-detail-assigned-users>
  </div>
  <div class="row" style="padding-top: 15px;">
    <div class="dx-field-item-label" style="padding: 5px 15px 5px 5px;">نمایش رکورد های بایگانی:</div>
    <dx-radio-group [items]="radioButtonItems"
                    displayExpr="text"
                    valueExpr="value"
                    layout="horizontal"
                    class="customRadioBtn"
                    (onValueChanged)="bindCustomDataSources()"
                    [(value)]="archiveMode">
      <style>
        .customRadioBtn /deep/ .dx-radiobutton-icon-dot {
          margin-right: 5px;
          margin-left: 5px;
        }
      </style>
    </dx-radio-group>
  </div>
  <app-busy-indicator>
    <app-base-list-form #listForm
                        [loadAfterSetFilter]="loadAfterSetFilter"
                        [entityName]="entityName"
                        [resourceName]="'AssignRefundDetail'"
                        [columns]="columns"
                        [wordWrapEnabled]="true"
                        [columnHidingEnabled]="true"
                        [allowDeleteInForm]="false"
                        [allowEditInForm]="false"
                        [allowInsertInForm]="false"
                        [customRowButtons]="customRowButtons"
                        [allowFilter]="true">
    </app-base-list-form>
  </app-busy-indicator>


  <dx-popup
    (onHidden)="requestForAssign=false"
    [(visible)]="requestForAssign"
    [closeOnOutsideClick]="true"
    [deferRendering]="false"
    [dragEnabled]="false"
    [fullScreen]="false"
    [rtlEnabled]="true"
    [maxHeight]="300"
    [maxWidth]="500"
    title="انتصاب به کاربر جهت پیگیری عودت وجه"
    class="popup">
    <div *dxTemplate="let data = model of 'content'">
      <ng-template appDetailComponentHost></ng-template>
    </div>
  </dx-popup>


  <dx-popup
    class="popup"
    [fullScreen]="true"
    [showTitle]="true"
    [rtlEnabled]="true"
    title="ثبت و نمایش رویداد"
    [dragEnabled]="false"
    [closeOnOutsideClick]="true"
    [(visible)]="showIssueLogWork"
    [deferRendering]="false">
    <div *dxTemplate="let data = model of 'content'" style="direction: rtl">
      <app-issue-log-work-detail [issueType]="issueType"
                                 [issueId]="null"
                                 [paymentId]="paymentId"
                                 [orderId]="orderId"
                                 *ngIf="showIssueLogWork"
                                 [customIssueTitle]="customIssueTitle"
                                 [fixHeight]="false"
                                 (afterInsertRow)="closeIssueLogWorkForm($event)"
                                 (closeFormClick)="closeIssueLogWorkForm($event)"></app-issue-log-work-detail>
      <br/>
      <app-issue-log-work-list id="issueLogWorkListForm"
                               [showCustomButtons]="false"
                               [allowDeleteInForm]="false"
                               [issueType]="issueType"
                               [paymentId]="paymentId"
                               *ngIf="showIssueLogWork"
                               [orderId]="orderId" [fixHeight]="false"></app-issue-log-work-list>
    </div>
  </dx-popup>
