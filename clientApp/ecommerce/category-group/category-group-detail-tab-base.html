<dx-tab-panel
  #tabPanel
  rtlEnabled="true"
  [dataSource]="tabs"
  [selectedIndex]="0"
  [loop]="false"
  [animationEnabled]="false"
  [swipeEnabled]="false">

  <div *dxTemplate="let categoryGroup of 'categoryGroup'"  class="tab-content-edit-form">
    <app-category-group-detail
      (afterInsertRow)="rowInserted($event)"
      [selectedEntityId]="selectedEntityId"
      entityName="categoryGroup"
      [closeAfterSave]="false"
    >

    </app-category-group-detail>
  </div>

  <div *dxTemplate="let categoryGroup of 'images'"  class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="1108"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>


</dx-tab-panel>
