<app-busy-indicator>
  <app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">

      <dxi-item [label]="{text: 'کد'}" dataField="code">


      </dxi-item>

      <dxi-item dataField="representationId" editorType="dxLookup" [label]="{text: 'نمایندگی'}"
                [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: representationDataSource,displayExpr:'title',valueExpr:'id' }">

        <dxi-validation-rule type="required" message="نمایندگی اجباری می باشد"></dxi-validation-rule>

      </dxi-item>

      <dxi-item dataField="personId" editorType="dxLookup" [label]="{text: 'شخص'}"
                [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: personDataSource,displayExpr:'name',valueExpr:'id' }">

        <dxi-validation-rule type="required" message="شخص اجباری می باشد"></dxi-validation-rule>

      </dxi-item>

      <dxi-item dataField="postId" editorType="dxLookup" [label]="{text: 'سمت'}"
                [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: postDataSource,displayExpr:'title',valueExpr:'id' }">

        <dxi-validation-rule type="required" message="سمت اجباری می باشد"></dxi-validation-rule>

      </dxi-item>
      <dxi-item [label]="{text: 'تاریخ جذب'}" dataField="fromDate" editorType='dxNumberBox'>
        <ng-persian-datepicker [dateInitValue]="false"
                               (dateOnSelect)="entity.fromDate=convertDateToInt($event);">
          <input type="text"
                 [formControl]="fromDateDataValue"
                 style="float:right"
                 placeholder="تاریخ جذب"
                 [ngModel]="entity.fromDate  | intToStringDate"/>
        </ng-persian-datepicker>
        <!--        <dp-date-picker-->
        <!--          [config]="datePickerConfig"-->
        <!--          dir="rtl"-->
        <!--          mode="day"-->
        <!--          placeholder="تاریخ جذب"-->
        <!--          theme="dp-material"-->
        <!--          [ngModel]="entity.fromDate | intToStringDate" (ngModelChange)="entity.fromDate=convertDateToInt($event)">-->
        <!--        </dp-date-picker>-->


      </dxi-item>
      <dxi-item [label]="{text: 'تاریخ رهایی'}" dataField="toDate" editorType='dxNumberBox'>
        <ng-persian-datepicker [dateInitValue]="false"
                               (dateOnSelect)="entity.toDate=convertDateToInt($event);">
          <input type="text"
                 [formControl]="toDateDataValue"
                 style="float:right"
                 placeholder="تاریخ رهایی"
                 [ngModel]="entity.toDate  | intToStringDate"/>
        </ng-persian-datepicker>
        <!--        <dp-date-picker-->
        <!--          [config]="datePickerConfig"-->
        <!--          dir="rtl"-->
        <!--          mode="day"-->
        <!--          placeholder="تاریخ رهایی"-->
        <!--          theme="dp-material"-->
        <!--          [ngModel]="entity.toDate | intToStringDate" (ngModelChange)="entity.toDate=convertDateToInt($event)">-->
        <!--        </dp-date-picker>-->


      </dxi-item>
      <dxi-item [label]="{text: 'توضیحات'}" dataField="description" editorType='dxTextArea'>


      </dxi-item>

      <dxi-item dataField="accessLevelId" editorType="dxSelectBox" [label]="{text: 'سطح دسترسی'}"
                [editorOptions]="{ items: accessLevels,displayExpr:'title',valueExpr:'id' }">
        <dxi-validation-rule type="required" message="سطح دسترسی اجباری می باشد"></dxi-validation-rule>

      </dxi-item>
    </dx-form>
  </app-base-edit-form>
</app-busy-indicator>
