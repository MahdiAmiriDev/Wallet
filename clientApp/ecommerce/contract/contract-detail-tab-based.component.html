<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let company of 'contract'" class="tab-content-edit-form">
        <app-contract-detail
                [selectedEntityId]="selectedEntityId"
                (afterInsertRow)="rowInserted($event)"
                entityName="contract"
                [companyId]="companyId"
                [representationId]="representationId"
                [taxCategoryId]="taxCategoryId"
                [contractType]="contractType"
                #mainBaseEdit
                [contractStatus]="contractStatus">
        </app-contract-detail>
    </div>
    <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="contract" propertyName="Description"
                            propertyLabel="توضیحات"></app-content-editor>
    </div>
</dx-tab-panel>
