<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'representationEstablishedLicenseType'" class="tab-content-edit-form">
    <app-representation-established-license-type-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="representationEstablishedLicenseType"
      [representationId]="representationId"
      [establishedLicenseType]="establishedLicenseType"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-representation-established-license-type-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="representationEstablishedLicenseType"
                        propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
</dx-tab-panel>
