<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'additionalUserProp'" class="tab-content-edit-form">
    <app-additional-user-prop-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="additionalUserProp"
      [userId]="userId"
      [companyId]="companyId"
      [representationId]="representationId"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-additional-user-prop-detail>
  </div>
</dx-tab-panel>
