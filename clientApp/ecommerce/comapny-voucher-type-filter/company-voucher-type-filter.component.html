<div class="row" style="padding-bottom: 5px">
  <div [ngClass]="showInOneRow?'col-6':'col-12'">
    <div style="float: right;width: 20%;margin-top: 0.5rem; font-size: 14px;text-align: right">
      <label>مرکز: </label>
    </div>
    <div style="float: right; width: 80%">
      <dx-lookup
        [disabled]="additionalUserProp && additionalUserProp.companyId"
        [dataSource]="companyDataSource"
        [(value)]="companyId"
        displayExpr="title"
        valueExpr="id"
        rtlEnabled="true"
        showCancelButton="true"
        (onSelectionChanged)="onSelectedCompanyChanged($event)"
        showClearButton="true">
        <dxo-drop-down-options
          [closeOnOutsideClick]="true"
          [showTitle]="false">
        </dxo-drop-down-options>
        <dx-validator *ngIf="isRequired">
          <dxi-validation-rule type="required" message="مرکز اجباری می باشد"></dxi-validation-rule>
        </dx-validator>
      </dx-lookup>
    </div>
  </div>
  <div [ngClass]="showInOneRow?'col-6':'col-12'">
    <div style="float: right;width: 20%;margin-top: 0.5rem; font-size: 14px;text-align: right">
      <label> {{voucherTypeLabel}} </label>
    </div>
    <div style="float: right; width: 80%">
      <dx-lookup
        [dataSource]="voucherTypeDataSource"
        [(value)]="voucherTypeId"
        displayExpr="title"
        valueExpr="id"
        rtlEnabled="true"
        showCancelButton="true"
        [showClearButton]="true"
        (onSelectionChanged)="onSelectedVoucherTypeChanged($event)">
        <dxo-drop-down-options
          [closeOnOutsideClick]="true"
          [showTitle]="false">
        </dxo-drop-down-options>
      </dx-lookup>
    </div>
  </div>
</div>
