<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'factorGroup'" class="tab-content-edit-form">
    <app-factor-group-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="factorGroup"
      [parentId]="parentId"
      [factorGroupStatus]="factorGroupStatus"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-factor-group-detail>
  </div>
