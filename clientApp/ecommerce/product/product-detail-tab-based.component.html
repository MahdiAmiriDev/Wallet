<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let company of 'product'" class="tab-content-edit-form">
        <app-product-detail
                [selectedEntityId]="selectedEntityId"
                (afterInsertRow)="rowInserted($event)"
                entityName="product"
                [companyId]="companyId"
                [appEntityId]="appEntityId"
                [productTemplateId]="productTemplateId"
                [giftCardTypeId]="giftCardTypeId"
                [downloadActivationType]="downloadActivationType"
                [recurringCyclePeriodType]="recurringCyclePeriodType"
                [taxCategoryId]="taxCategoryId"
                [basePriceUnitType]="basePriceUnitType"
                [basePriceBaseUnitType]="basePriceBaseUnitType"
                [closeAfterSave]="false"
                #mainBaseEdit
                (closeFormClick)="closeFormClick.emit($event)"
        >
        </app-product-detail>
    </div>
    <div *dxTemplate="let company of 'shortDescription'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="product" propertyName="ShortDescription"
                            propertyLabel="توضیحات کوتاه"></app-content-editor>
    </div>
    <div *dxTemplate="let company of 'fullDescription'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="product" propertyName="FullDescription"
                            propertyLabel="توضیحات کامل"></app-content-editor>
    </div>
    <div *dxTemplate="let company of 'adminComment'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="product" propertyName="AdminComment"
                            propertyLabel="توضیح مدیر"></app-content-editor>
    </div>
    <div *dxTemplate="let company of 'metaDescription'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="product" propertyName="MetaDescription"
                            propertyLabel="توضیحات"></app-content-editor>
    </div>
    <div *dxTemplate="let company of 'userAgreementText'" class="tab-content-edit-form">
        <app-content-editor [selectedEntityId]="selectedEntityId" entityName="product" propertyName="UserAgreementText"
                            propertyLabel="متن توافقنامه کاربری"></app-content-editor>
    </div>
</dx-tab-panel>
