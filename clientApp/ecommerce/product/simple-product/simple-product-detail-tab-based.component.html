<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let company of 'product'" class="tab-content-edit-form">
        <app-simple-product-detail
                [selectedEntityId]="selectedEntityId"
                (afterInsertRow)="rowInserted($event)"
                entityName="product"
                [companyId]="companyId"
                [appEntityId]="appEntityId"
                [productTemplateId]="productTemplateId"
                [giftCardTypeId]="giftCardTypeId"
                [downloadActivationType]="downloadActivationType"
                [recurringCyclePeriodType]="recurringCyclePeriodType"
                [taxCategoryId]="taxCategoryId"
                [basePriceUnitType]="basePriceUnitType"
                [basePriceBaseUnitType]="basePriceBaseUnitType"
                (afterDataLoaded)="dataLoaded($event)"
                [closeAfterSave]="false"
                #mainBaseEdit
                (closeFormClick)="closeFormClick.emit($event)">
        </app-simple-product-detail>
    </div>
    <div *dxTemplate="let company of 'salePlanning'" class="tab-content-edit-form">
        <app-product-sales-planning-list [selectedProduct]="selectedProduct"
                                         [productId]="selectedEntityId"></app-product-sales-planning-list>
    </div>
    <div *dxTemplate="let company of 'shortDescription'" class="tab-content-edit-form">
        <app-product-specification-option-list [productId]="selectedEntityId"></app-product-specification-option-list>
    </div>
    <div *dxTemplate="let company of 'dependentProductSale'" class="tab-content-edit-form">
        <app-dependent-product-sale-list [mainProductId]="selectedEntityId"></app-dependent-product-sale-list>
    </div>
    <div *dxTemplate="let pic of 'pics'" class="tab-content-edit-form">
        <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="23"
                                    [objectId]="selectedEntityId"></app-entity-document-upload>
    </div>
</dx-tab-panel>
