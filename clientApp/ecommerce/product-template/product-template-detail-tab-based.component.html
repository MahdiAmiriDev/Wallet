<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'productTemplate'" class="tab-content-edit-form">
    <app-product-template-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="productTemplate"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-product-template-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="productTemplate" propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
</dx-tab-panel>
