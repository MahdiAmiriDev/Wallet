<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
    <div *dxTemplate="let item of 'productTags'" class="tab-content-edit-form">
			<app-product-tags-detail 
                [selectedEntityId]="selectedEntityId" 
                (afterInsertRow)="rowInserted($event)"  
                entityName="productTags" 
                
                    [parentId]="parentId"
                
                    [productId]="productId"
                
                    [tagType]="tagType"
                >
            </app-product-tags-detail>
	</div>
    
		<div *dxTemplate="let item of 'productTags'" class="tab-content-edit-form">
			<app-content-editor [selectedEntityId]="selectedEntityId" entityName="productTags" 
                                propertyName="Description"
								propertyLabel="توضیحات"></app-content-editor>
		</div>
</dx-tab-panel>
