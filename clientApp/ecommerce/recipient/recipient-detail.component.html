
				<app-busy-indicator><app-base-edit-form   (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
	<dx-form id="form"  [colCount]="2" #detailForm [formData]="entity">

									<dxi-item [label]="{text: 'کد'}"  dataField="code" >


				</dxi-item>
									<dxi-item [label]="{text: 'عنوان'}"  dataField="title" >

																<dxi-validation-rule  type="required" message="عنوان اجباری می باشد"></dxi-validation-rule>

				</dxi-item>

									<dxi-item dataField="addressId" editorType="dxLookup" [label]="{text: 'آدزس'}"
					[editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: addressDataSource,displayExpr:'title',valueExpr:'id' }">


				</dxi-item>
									<dxi-item [label]="{text: 'توضیحات'}"  dataField="description" editorType='dxTextArea'>


				</dxi-item>
									<dxi-item [label]="{text: 'کد ملی'}"  dataField="nationalCode" >

																<dxi-validation-rule  type="required" message="کد ملی اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
									<dxi-item [label]="{text: 'شماره کارت'}"  dataField="cardNumber" >


				</dxi-item>

									<dxi-item dataField="membershipType" editorType="dxSelectBox" [label]="{text: 'نوع عضویت'}"
					[editorOptions]="{ items: membershipTypes,displayExpr:'title',valueExpr:'id' }">
																					<dxi-validation-rule  type="required" message="نوع عضویت اجباری می باشد"></dxi-validation-rule>

				</dxi-item>

									<dxi-item dataField="accessLevelId" editorType="dxSelectBox" [label]="{text: 'سطح دسترسی'}"
					[editorOptions]="{ items: accessLevels,displayExpr:'title',valueExpr:'id' }">
																					<dxi-validation-rule  type="required" message="سطح دسترسی اجباری می باشد"></dxi-validation-rule>

				</dxi-item>
</dx-form>
</app-base-edit-form></app-busy-indicator>
