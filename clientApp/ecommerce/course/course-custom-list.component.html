<div style="width: 100%;" [style.height.px]="contentHeight">
  <div class="row" style="padding-bottom: 5px" *ngIf="!additionalUserProp || !additionalUserProp.companyId">
    <div class="col-6">
      <div style="float: right;width: 20%;margin-top: 0.5rem; font-size: 14px;text-align: right">
        <label>{{'shp.Company.Title' | translate}}</label>
      </div>
      <div style="float: right; width: 80%">
        <app-company-select
                [disabled] ="additionalUserProp && additionalUserProp.companyId"
                [selectedCompanyId]="companyId"
                (selectedRowChanged)="selectedCompanyChanged($event);">
        </app-company-select>

      </div>
    </div>
    <div class="col-6"></div>
  </div>
  <div class="row">
    <div class="col-12">

      <div style="width: 100%;" [style.height.px]="contentHeight">
        <as-split direction="horizontal" dir="ltr">
          <as-split direction="horizontal">
            <as-split-area size="75" #t1 dir="rtl">
              <app-base-list-form title="{{'shp.Product.Title' | translate}}"
                                  [allowGrouping]="false"
                                  [wordWrapEnabled]="true"
                                  loadAfterSetFilter="true"
                                  (afterInitialDetailComponent)="afterInitialDetailComponent($event)"
                                  [columns]="columns"
                                  [entityName]="entityName"
                                  [showExportToExcelButton]="true"
                                  [pagerDisplayMode]="'compact'"
                                  #listForm
                                  [detailComponent]="detailComponent"
                                  [allowDeleteInForm] = "false"
                                  [allowArchiveInForm]="true"
                                  [customArchiveActionName]="customArchiveAction"
                                  [customRestoreActionName]="customRestoreActionName"
                                  [customButtonCheckBoxTitle]="customButtonCheckBoxTitle"
                                  [showCustomCheckBox]="true"
                                  (customCheckBoxEvent)="onCustomCheckBoxChange($event)"
              >
              </app-base-list-form>
            </as-split-area>
            <as-split-area size="25" #t2 dir="rtl">
              <app-category-list
                [loadAfterSetFilter]="true"
                [companyId]="companyId"
                [representationId]="representationId"
                [allowEdit]="false"
                (selectedRowChanged)="selectedCategoryChanged($event)"></app-category-list>
            </as-split-area>
          </as-split>

        </as-split>
      </div>


    </div>
  </div>
</div>
