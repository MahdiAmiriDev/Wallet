<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'course'" class="tab-content-edit-form">
    <app-course-detail [companyId]="companyId"
                       [categoryId]="categoryId"
                       [selectedEntityId]="selectedEntityId"
                       (afterInsertRow)="rowInserted($event)"
                       (afterDataLoaded)="setProductData($event)"
                       entityName="product"
                       [closeAfterSave]="false"
                       #mainBaseEdit
                       (closeFormClick)="closeFormClick.emit($event)"
    ></app-course-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Description"
                        propertyLabel="{{'tms.Course.Description' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'topic'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Topic"
                        propertyLabel="{{'tms.Course.Topic' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'prerequisite'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Prerequisite"
                        propertyLabel="{{'tms.Course.Prerequisite' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'target'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Target"
                        propertyLabel="{{'tms.Course.Target' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'requirements'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Requirements"
                        propertyLabel="{{'tms.Course.Requirements' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'skill'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Skill"
                        propertyLabel="{{'tms.Course.Skill' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'audience'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="courseId" entityName="course" propertyName="Audience"
                        propertyLabel="{{'tms.Course.Audience' | translate}}"></app-content-editor>
  </div>
  <div *dxTemplate="let company of 'icon'" class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="29"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>
  <div *dxTemplate="let company of 'film'" class="tab-content-edit-form">
    <app-entity-document-upload [appEntityName]="entityName" [docCategoryId]="28"
                                [objectId]="selectedEntityId"></app-entity-document-upload>
  </div>
  <div *dxTemplate="let company of 'coursePlanning'" class="tab-content-edit-form">
    <app-course-planning-list [product]="product" [representationId]=""
                              [productId]="selectedEntityId"></app-course-planning-list>
  </div>
  <ng-container *ngIf="!lmsMode">
  <div
    *dxTemplate="let company of 'productTag'"
    class="tab-content-edit-form">
    <app-product-tags-list
      [productId]="selectedEntityId"
    >
    </app-product-tags-list>
  </div>
  </ng-container>
</dx-tab-panel>
