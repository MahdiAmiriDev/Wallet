<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'companyMainCategory'" class="tab-content-edit-form">
    <app-company-main-category-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="companyMainCategory"
      [companyId]="companyId"
      [categoryId]="categoryId"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-company-main-category-detail>
  </div>
  <div *dxTemplate="let company of 'description'" class="tab-content-edit-form">
    <app-content-editor [selectedEntityId]="selectedEntityId" entityName="companyMainCategory"
                        propertyName="Description"
                        propertyLabel="توضیحات"></app-content-editor>
  </div>
</dx-tab-panel>
