<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'factorGroupConvertReport'" class="tab-content-edit-form">
    <app-factor-group-convert-item-list [factorGroupId]="factorGroupId"></app-factor-group-convert-item-list>
  </div>
  <div *dxTemplate="let company of 'factorGroupItemReport'" class="tab-content-edit-form">
    <app-factor-group-item-list
      [factorGroupId]="factorGroupId">
    </app-factor-group-item-list>
  </div>
  <div *dxTemplate="let company of 'factorGroupFactorItems'" class="tab-content-edit-form">
    <app-factor-group-factor-item-list [factorGroupId]="factorGroupId"></app-factor-group-factor-item-list>
  </div>
  <div *dxTemplate="let company of 'factorGroupFactorItemPayments'" class="tab-content-edit-form">
    <app-factor-group-factor-item-payment-list
      [factorGroupId]="factorGroupId"></app-factor-group-factor-item-payment-list>
  </div>
</dx-tab-panel>
