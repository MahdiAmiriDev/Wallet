<div dir="rtl" *ngIf="showRepresentationFilter">
  <div dir="rtl">
    <div class="col-12">
      <div class="row">
        <div class="col-7">
          <app-representation-filter
            (selectedRepresentationChanged)="onSelectedRepresentationChanged($event)"
          >
          </app-representation-filter>
        </div>
        <div class="col-5">
          <div style="float: right; width: 23%; margin-top: 0.5rem; font-size: 14px; text-align: right;">
            <label>وضعیت سفارش:</label>
          </div>
          <div class="dx-field">
            <div class="dx-field-value">
              <dx-select-box dataField="orderStatusType" text="وضعیت سفارش"
                             [items]="orderStatusTypes"
                             displayExpr="title"
                             rtlEnabled="true"
                             valueExpr="id"
                             [(value)]="orderStatusType"
                             [showClearButton]="true"
                             (onSelectionChanged)="selectedOrderStatusChanged($event)">
              </dx-select-box>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-12">
      <div class="row">
        <div class="col-4" style="margin-left: 55px;">
          <div style="float: right; width: 30%; margin-top: 0.5rem; font-size: 14px; text-align: right;">
            <label>تاریخ ثبت از:</label>
          </div>
          <ng-persian-datepicker [dateInitValue]="false"
                                 (dateOnSelect)="orderCreationDateFilterFromDate=convertDateToInt($event);bindCustomDataSources();">
            <input type="text"
                   [formControl]="orderCreationDateFilterFromDateDataValue"
                   style="float:right"
                   placeholder="تاریخ شروع ثبت سفارش"
                   [ngModel]="orderCreationDateFilterFromDate  | intToStringDate"
                   (ngModelChange)="bindCustomDataSources();"/>
          </ng-persian-datepicker>
          <!--          <dp-date-picker-->
          <!--            [config]="datePickerConfig"-->
          <!--            dir="rtl"-->
          <!--            mode="day"-->
          <!--            placeholder="تاریخ شروع ثبت سفارش"-->
          <!--            theme="dp-material"-->
          <!--            [ngModel]="orderCreationDateFilterFromDate | intToStringDate"-->
          <!--            (ngModelChange)="orderCreationDateFilterFromDate=convertDateToInt($event);bindCustomDataSources();">-->
          <!--          </dp-date-picker>-->
        </div>
        <div class="col-4" >
          <div style="float: right; width: 30%; margin-top: 0.5rem; font-size: 14px; text-align: right;">
            <label>تا تاریخ:</label>
          </div>
          <ng-persian-datepicker [dateInitValue]="false"
                                 (dateOnSelect)="orderCreationDateFilterToDate=convertDateToInt($event);bindCustomDataSources();">
            <input type="text"
                   [formControl]="orderCreationDateFilterToDateDataValue"
                   style="float:right"
                   placeholder="تاریخ پایان ثبت سفارش"
                   [ngModel]="orderCreationDateFilterToDate  | intToStringDate"
                   (ngModelChange)="bindCustomDataSources();"/>
          </ng-persian-datepicker>
          <!--          <dp-date-picker-->
          <!--            [config]="datePickerConfig"-->
          <!--            dir="rtl"-->
          <!--            mode="day"-->
          <!--            placeholder="تاریخ پایان ثبت سفارش"-->
          <!--            theme="dp-material"-->
          <!--            [ngModel]="orderCreationDateFilterToDate | intToStringDate"-->
          <!--            (ngModelChange)="orderCreationDateFilterToDate=convertDateToInt($event);bindCustomDataSources();">-->
          <!--          </dp-date-picker>-->
        </div>
      </div>
    </div>
  </div>

</div>
<app-base-list-form #listForm
                    [gridHeight]="gridHeight"
                    [allowFilter]="allowFilter"
                    (listRowPrepared)="onListRowPrepared($event)"
                    [showListHeader]="showListHeader"
                    [wordWrapEnabled]="true"
                    [loadAfterSetFilter]="loadAfterSetFilter"
                    (selectedRowChanged)="selectedRowChanged.emit($event)"
                    [columns]="columns"
                    [entityName]="entityName"
                    [detailComponent]="detailComponent"
                    [allowDeleteInForm]="false"
                    [allowEditInForm]="false"
                    [allowInsertInForm]="false"
                    [showExportToExcelButton]="true"
                    [customRowButtons]="customRowButtons"
                    [columnAutoWidth]="true"
                    [isForSelectReadOnly]="isForSelectReadOnly"
                    [allowGrouping]="allowGrouping"
>
</app-base-list-form>

<dx-popup
  [title]="popUpTitle"
  (onHidden)="showPopUp=false"
  [(visible)]="showPopUp"
  [closeOnOutsideClick]="true"
  [deferRendering]="false"
  [dragEnabled]="false"
  [fullScreen]="true"
  [rtlEnabled]="true"
  class="popup">
  <div *dxTemplate="let data = model of 'content'">
    <ng-template appDetailComponentHost></ng-template>
  </div>
</dx-popup>
