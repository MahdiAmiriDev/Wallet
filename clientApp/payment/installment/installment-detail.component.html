<app-busy-indicator>
  <app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">

      <dxi-item [label]="{text: 'مبلغ قسط'}" dataField="installmentAmount" editorType='dxNumberBox'
                [editorOptions]="{readOnly: true}">

        <dxi-validation-rule type="required" message="مبلغ قسط اجباری می باشد"></dxi-validation-rule>

      </dxi-item>

      <dxi-item [label]="{text: 'تاریخ قسط'}" dataField="dueDate" [editorOptions]="{readOnly: true}">
        <ng-persian-datepicker [dateInitValue]="false"
                               (dateOnSelect)="entity.dueDate=convertDateToInt($event);">
          <input type="text"
                 [formControl]="dueDateDataValue"
                 style="float:right"
                 placeholder="تاریخ قسط"
                 [ngModel]="entity.dueDate  | intToStringDate"/>
        </ng-persian-datepicker>
        <!--            <dp-date-picker-->
        <!--                    [config]="datePickerConfig"-->
        <!--                    dir="rtl"-->
        <!--                    mode="day"-->
        <!--                    placeholder="تاریخ قسط"-->
        <!--                    theme="dp-material"-->
        <!--                    disabled="true"-->
        <!--                    [ngModel]="entity.dueDate | intToStringDate"-->
        <!--                    (ngModelChange)="entity.dueDate=convertDateToInt($event)">-->
        <!--            </dp-date-picker>-->

        <dxi-validation-rule type="required" message="تاریخ قسط اجباری می باشد"></dxi-validation-rule>

      </dxi-item>

      <dxi-item dataField="paymentId" editorType="dxLookup" [label]="{text: 'شناسه پرداخت'}"
                [editorOptions]="{readOnly:true,rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: paymentDataSource,displayExpr:'id',valueExpr:'id' }">

        <dxi-validation-rule type="required" message="شناسه پرداخت اجباری می باشد"></dxi-validation-rule>

      </dxi-item>

      <dxi-item dataField="paymentStatus" editorType="dxSelectBox" [label]="{text: 'وضعیت پرداخت'}"
                [editorOptions]="{ items: paymentStatuss,displayExpr:'title',valueExpr:'id' }">
        <dxi-validation-rule type="required" message="وضعیت پرداخت اجباری می باشد"></dxi-validation-rule>

      </dxi-item>
    </dx-form>
  </app-base-edit-form>
</app-busy-indicator>
