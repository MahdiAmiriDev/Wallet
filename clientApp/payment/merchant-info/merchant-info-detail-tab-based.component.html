<dx-tab-panel
    #tabPanel
    rtlEnabled="true"
    [dataSource]="tabs"
    [selectedIndex]="0"
    [loop]="false"
    [animationEnabled]="false"
    [swipeEnabled]="false">
  <div *dxTemplate="let company of 'merchantInfo'" class="tab-content-edit-form">
    <app-merchant-info-detail
      [selectedEntityId]="selectedEntityId"
      (afterInsertRow)="rowInserted($event)"
      entityName="merchantInfo"
      [state]="state"
      [city]="city"
      [closeAfterSave]="false"
      #mainBaseEdit
      (closeFormClick)="closeFormClick.emit($event)"
    >
    </app-merchant-info-detail>
  </div>
  <div *dxTemplate="let company of 'terminal'" class="tab-content-edit-form">
    <app-yashil-hekmat-terminal-list [merchantId]="selectedEntityId">

    </app-yashil-hekmat-terminal-list>
  </div>

</dx-tab-panel>
