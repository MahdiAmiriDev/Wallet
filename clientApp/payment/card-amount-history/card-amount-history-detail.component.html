<app-busy-indicator><app-base-edit-form (submitEvent)="formSubmit($event)" (cancelEditOrInsert)="onCloseFormClick()">
    <dx-form id="form" [colCount]="2" #detailForm [formData]="entity">

        <dxi-item [label]="{text: 'کد'}" dataField="code">


        </dxi-item>
        <dxi-item [label]="{text: 'عنوان'}" dataField="title">


        </dxi-item>
        <dxi-item [label]="{text: 'توضیحات'}" dataField="description" editorType='dxTextArea'>


        </dxi-item>

        <dxi-item dataField="accessLevelId" editorType="dxSelectBox" [label]="{text: 'سطح دسترسی'}"
                  [editorOptions]="{ items: accessLevels,displayExpr:'title',valueExpr:'id' }">
            <dxi-validation-rule type="required" message="سطح دسترسی اجباری می باشد"></dxi-validation-rule>

        </dxi-item>

        <dxi-item dataField="cardInfoId" editorType="dxLookup" [label]="{text: 'اطلاعات کارت'}"
                  [editorOptions]="{rtlEnabled:true,dropDownOptions:{closeOnOutsideClick:true, showTitle:false}, dataSource: cardInfoDataSource,displayExpr:'title',valueExpr:'id' }">

            <dxi-validation-rule type="required" message="اطلاعات کارت اجباری می باشد"></dxi-validation-rule>

        </dxi-item>
        <dxi-item [label]="{text: 'اعتباری یا ریالی'}" dataField="creditOrCash" editorType='dxCheckBox'>


        </dxi-item>
        <dxi-item [label]="{text: 'مبلغ جاری'}" dataField="currentAmount" editorType='dxNumberBox'>

            <dxi-validation-rule type="required" message="مبلغ جاری اجباری می باشد"></dxi-validation-rule>

        </dxi-item>
        <dxi-item [label]="{text: 'مبلغ جدید'}" dataField="newAmount" editorType='dxNumberBox'>

            <dxi-validation-rule type="required" message="مبلغ جدید اجباری می باشد"></dxi-validation-rule>

        </dxi-item>
        <dxi-item [label]="{text: 'مبلغ شارژ شده'}" dataField="amount" editorType='dxNumberBox'>


        </dxi-item>
    </dx-form>
</app-base-edit-form></app-busy-indicator>
